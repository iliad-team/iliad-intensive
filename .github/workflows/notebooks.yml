# Colab notebooks: tex/<slug>/<name>.py masters -> orphan notebook branches.
#
# tex/gen_notebooks.py --publish builds every master's <name>_nosol.ipynb and
# <name>_sol.ipynb into build/notebooks/<slug>/, next to a copy of the module's
# support/. Colab opens them from a branch (.github/notebooks-branch.sh does
# every write, each one a single orphan commit):
#   notebooks          production, written only by a push to main
#   notebooks-pr-<N>   PR <N>'s preview, written only by that PR, deleted on close
# e.g. https://colab.research.google.com/github/iliad-team/iliad-intensive/blob/notebooks/<slug>/<name>_sol.ipynb
# A PR never writes `notebooks`, and no branch has two writers.
# Nothing generated is ever committed to main. See docs/NOTEBOOKS.md.
#
# Separate from site.yml on purpose: a worksheet edit never regenerates a
# notebook and a notebook edit never runs the LaTeX ladder. The images the
# notebooks show are NOT published here — the site build stages them under
# /uploads/<slug>/nb/ (scripts/build-content.mjs), production's at the site root
# and a preview's under /pr-preview/pr-<N>/, and the notebooks link there.
#
# PR previews: EVERY same-repo PR publishes its notebooks (seconds of work),
# because its site preview's \notebooksol links point at them (site.yml sets
# NOTEBOOK_PREVIEW_PR) whether or not the PR touched a notebook. A fork's PR
# gets no notebook preview — its token is read-only — and its site preview links
# production's notebooks instead.
name: notebooks

on:
  push:
    branches: [main]
    paths:
      - "tex/*/*.py"
      - "tex/*/fig/**"
      - "tex/*/support/**"
      - "tex/gen_notebooks.py"
      - "tex/notebook-header.md"     # the header cell every notebook starts with
      - "schedule.yaml"              # the header's link back to the page
      - ".github/workflows/notebooks.yml"
      - ".github/notebooks-branch.sh"
  pull_request:
    types: [opened, synchronize, reopened]
  # PR close only: removes the PR's preview. Safe on pull_request_target (write
  # token even for forks) ONLY because that job never checks out or runs
  # anything from the PR — see preview-cleanup.
  pull_request_target:
    types: [closed]
  # Backstop for preview-cleanup, which gets one chance per PR.
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # One run per PR (a newer push supersedes an older one) and one line for
    # main (a newer merge publishes the newer tree). Each writes only its own
    # branch, so different PRs and main never wait on each other. Deliberately NOT
    # one group shared by all: GitHub cancels an older *pending* run in a group,
    # which could silently drop a production publish queued behind a PR build.
    concurrency:
      group: notebooks-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      # LFS: support/ can hold binaries the modules load (D.2's sprites.png), and
      # those are published as-is. (fig/ images are the site build's business.)
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Standard library only — nothing to install. Fails on any master that
      # doesn't convert, or links an image outside fig/.
      - name: Build the notebooks
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python3 tex/gen_notebooks.py --publish --preview "${{ github.event.number }}"
          else
            python3 tex/gen_notebooks.py --publish
          fi
          mkdir -p build/notebooks

      - name: Check the published tree
        run: |
          set -euo pipefail
          cd build/notebooks
          find . -type f | sort
          for nb in $(find . -name '*.ipynb'); do
            python3 -c "import json, sys; json.load(open(sys.argv[1]))" "$nb"
            if grep -qE '(\]\(|src=\\")(data:|attachment:|fig/)' "$nb"; then
              echo "::error::$nb still has an embedded or relative image"; exit 1
            fi
          done

      # The script also refuses `production` unless GITHUB_REF is main.
      - name: Publish production (main only)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/notebooks-branch.sh production build/notebooks

      - name: Publish this PR's preview
        if: >-
          github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/notebooks-branch.sh preview "${{ github.event.number }}" build/notebooks

      # One marked comment per PR, upserted, listing the preview's notebooks.
      # Best-effort: an API blip must not fail a good publish.
      - name: Comment notebook links
        if: >-
          github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs'), path = require('path');
            const pr = context.issue.number;
            const marker = '<!-- notebook-preview -->';
            const colab = (p) => `https://colab.research.google.com/github/${context.repo.owner}/${context.repo.repo}/blob/notebooks-pr-${pr}/${p}`;
            const root = 'build/notebooks';
            const rows = [];
            for (const slug of fs.readdirSync(root).sort()) {
              for (const f of fs.readdirSync(path.join(root, slug)).sort()) {
                const m = f.match(/^(.*)_nosol\.ipynb$/);
                if (m) rows.push(`- \`${slug}/${m[1]}\`: [without solutions](${colab(`${slug}/${f}`)}) · [with solutions](${colab(`${slug}/${m[1]}_sol.ipynb`)})`);
              }
            }
            const head = context.payload.pull_request.head.sha.slice(0, 7);
            const body = rows.length
              ? `${marker}\n📓 **Notebook preview** (opens in Colab), built from \`${head}\`. Removed automatically when this PR closes.\n\n${rows.join('\n')}`
              : `${marker}\n📓 No notebooks in this PR's tree.`;
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: pr });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: pr, body });

  # When a PR closes, delete its notebooks-pr-<N> branch. Checks out main only — never
  # the PR — which is what makes pull_request_target safe here.
  preview-cleanup:
    if: github.event_name == 'pull_request_target' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove the PR's notebook preview
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/notebooks-branch.sh remove "${{ github.event.number }}"

  preview-sweep:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Delete notebooks-pr-* branches whose PR is no longer open
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: .github/notebooks-branch.sh sweep
