# Live previews for FORK PRs — the half of the preview story site.yml cannot
# do itself. On a `pull_request` event from a fork, GITHUB_TOKEN is read-only
# no matter what `permissions:` asks for (that run executes the fork's code,
# so GitHub caps it — the right call), which is why site.yml's preview-deploy
# is gated to same-repo PRs. This workflow is the privileged other half: it
# fires via `workflow_run` AFTER a site build completes, runs in the BASE
# repo's context with a write token, and publishes the fork build's artifact.
#
# The trust model, and the lines that must never be crossed:
# - This workflow NEVER checks out or executes anything from the PR. The only
#   PR-derived input is the built site, downloaded as an inert artifact and
#   copied into gh-pages/pr-preview/pr-<N>/. Checkouts here are main (for the
#   publish script + allowlist) and gh-pages. Keep it that way: one `npm ci`
#   of the PR's tree in this file hands a write token to the internet.
# - Publishing still means serving PR-author-controlled HTML from
#   iliad-team.github.io — the production site's origin. So it is gated on
#   WHO, not just on green checks: org members, collaborators, and anyone
#   with a previously MERGED PR here publish automatically; everyone else
#   must be allowlisted ONCE by a maintainer in .github/preview-allowlist.txt
#   (useful for trusting someone before their first merge), after which all
#   their future PRs publish automatically. The allowlist is read from THIS
#   repo's default branch, never from the PR, so a PR cannot allowlist its
#   own author.
# - The PR number (it names the directory the publish overwrites) is resolved
#   from the GitHub API by the triggering run's head SHA — never read from
#   the artifact, whose contents the PR author controls.
#
# NOTE: `workflow_run` triggers off the copy of this file on the DEFAULT
# branch — edits here do nothing until they are merged to main, so this
# cannot be exercised from its own PR.
name: fork-preview

on:
  workflow_run:
    workflows: [site]
    types: [completed]

permissions:
  contents: read

jobs:
  preview-deploy:
    # Successful PR builds from a fork only. Same-repo PRs are previewed by
    # site.yml's own preview-deploy in the same run (no trust gate needed —
    # anyone who can push a branch here can already run privileged workflows).
    if: >-
      github.event.workflow_run.event == 'pull_request'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.head_repository.full_name != github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write        # push gh-pages
      pull-requests: write   # upsert the preview-URL comment
      actions: read          # download the site artifact from the triggering run
    # Same lock every gh-pages writer takes: publishing force-pushes the whole
    # branch, so two writers racing would silently drop one's work.
    concurrency:
      group: gh-pages-write
      cancel-in-progress: false
    steps:
      # Default checkout in a workflow_run context is the DEFAULT branch, and
      # that is the point: the publish script and the allowlist come from
      # main, never from the PR.
      - uses: actions/checkout@v4

      - name: Resolve PR + trust gate
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          # workflow_run's own pull_requests[] payload is EMPTY for fork PRs,
          # and the commits/<sha>/pulls endpoint returns nothing for a commit
          # that only exists via a fork's refs/pull/N/head (verified against
          # PR #119) — so list the open PRs and match on head SHA. Requiring
          # the PR's CURRENT head to equal this run's head also makes a stale
          # run — the author pushed again while this build ran — skip cleanly
          # instead of publishing an outdated preview over the newer one.
          resp=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100")
          mapfile -t pr < <(jq -r --arg sha "$HEAD_SHA" --arg repo "$GITHUB_REPOSITORY" '
            [.[] | select(.head.sha == $sha and .base.repo.full_name == $repo)]
            | first // empty
            | .number, .user.login, .author_association' <<< "$resp")
          if [ "${#pr[@]}" -eq 0 ]; then
            echo "no open PR currently at $HEAD_SHA (closed, or superseded by a newer push) — nothing to publish"
            echo "number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          NUMBER="${pr[0]}"; LOGIN="${pr[1]}"; ASSOC="${pr[2]}"
          # NUMBER names the gh-pages directory the publish overwrites, so
          # insist on a bare integer even though it came from the API.
          [[ "$NUMBER" =~ ^[0-9]+$ ]] || { echo "::error::PR number '$NUMBER' is not numeric"; exit 1; }
          trusted=false
          # CONTRIBUTOR = has at least one PR merged into this repo. Trusting
          # it mirrors GitHub's own Actions-approval gate, which also stops
          # prompting after a first merge — so merging someone's PR is the
          # "approve once" that unlocks both. The flip side is deliberate too:
          # merging ANY PR of theirs (even a one-line typo fix) grants preview
          # publishing forever; the allowlist below is then only for trusting
          # someone BEFORE their first merge.
          case "$ASSOC" in OWNER|MEMBER|COLLABORATOR|CONTRIBUTOR) trusted=true ;; esac
          # -i: GitHub logins are case-insensitive. -xF: whole line, literally.
          if [ "$trusted" = false ] && [ -f .github/preview-allowlist.txt ] \
             && grep -vE '^[[:space:]]*(#|$)' .github/preview-allowlist.txt | grep -qixF "$LOGIN"; then
            trusted=true
          fi
          echo "PR #$NUMBER by $LOGIN ($ASSOC): trusted=$trusted"
          { echo "number=$NUMBER"; echo "login=$LOGIN"; echo "trusted=$trusted"; } >> "$GITHUB_OUTPUT"

      # The artifact is untrusted bytes and stays that way: copied onto
      # gh-pages, never executed, nothing sourced from it.
      - name: Download built site
        if: steps.pr.outputs.trusted == 'true'
        uses: actions/download-artifact@v4
        with:
          name: site
          path: out
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Guard against an empty artifact
        if: steps.pr.outputs.trusted == 'true'
        run: test -f out/index.html || { echo "::error::empty artifact — refusing to publish"; exit 1; }

      - uses: actions/checkout@v4
        if: steps.pr.outputs.trusted == 'true'
        with:
          ref: gh-pages
          path: .deploy
      # Swap in THIS PR's subfolder and leave everything else — production
      # root and the other previews — exactly as checked out (the force-push
      # publishes the whole tree; see site.yml's preview-deploy).
      - name: Stage this PR's preview
        if: steps.pr.outputs.trusted == 'true'
        run: |
          set -euo pipefail
          DIR=".deploy/pr-preview/pr-${{ steps.pr.outputs.number }}"
          rm -rf "$DIR"
          mkdir -p "$DIR"
          cp -a out/. "$DIR"/
      - name: Publish
        if: steps.pr.outputs.trusted == 'true'
        run: |
          .github/publish-gh-pages.sh "Preview for PR #${{ steps.pr.outputs.number }} (fork)"

      # Same marker + upsert as site.yml's comment, so a PR only ever carries
      # one preview comment whichever workflow wrote it. For an untrusted
      # author the comment says how a maintainer turns previews on instead.
      - name: Comment preview URL
        if: steps.pr.outputs.number != ''
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_LOGIN: ${{ steps.pr.outputs.login }}
          TRUSTED: ${{ steps.pr.outputs.trusted }}
        with:
          script: |
            const pr = Number(process.env.PR_NUMBER);
            const marker = '<!-- pr-preview-url -->';
            const headSha = context.payload.workflow_run.head_sha;
            const url = `https://iliad-team.github.io/iliad-intensive/pr-preview/pr-${pr}/`;
            const body = process.env.TRUSTED === 'true'
              ? `${marker}\n🔎 **Live preview:** ${url}\n\nUpdated for \`${headSha.slice(0, 7)}\`. Removed automatically when this PR closes.`
              : `${marker}\n🔒 No live preview: fork PRs publish only for trusted authors. @${process.env.PR_LOGIN} becomes trusted — permanently, for all future PRs — when any PR of theirs is merged, or when a maintainer adds that username to \`.github/preview-allowlist.txt\` on \`main\`.`;
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: pr });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: pr, body });
            }
