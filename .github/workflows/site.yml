# tex -> mdx -> static site. Only tex/ sources live in git; MDX, SVGs, PDFs and
# the site itself are build artifacts. Every PR gets the full check ladder
# (conversion + render gate + PDF builds) AND a live preview deploy so a
# reviewer can look before merge; pushes to main deploy the production site.
# (For PRs from forks the preview publish half lives in fork-preview.yml,
# which runs after this workflow — the read-only fork token can't push here.)
#
# Hosting model: a single `gh-pages` branch holds everything —
#   /                      -> production site (from main)
#   /pr-preview/pr-<N>/    -> per-PR preview (removed when the PR closes)
# so a preview can coexist with production. A preview holds only the
# worksheets the PR touched plus the shell — the rest link to the live site
# at the root, which IS the unchanged page (src/lib/preview.ts,
# scripts/prune-preview.mjs); a PR that touches a shared input gets the full
# site as before. REQUIRES a one-time repo setting:
# Settings -> Pages -> Source = "Deploy from a branch" -> gh-pages / (root).
# See docs/PR-PREVIEWS.md.
#
# History: gh-pages keeps NONE. Every publish force-pushes a single orphan
# commit via .github/publish-gh-pages.sh, so the branch is always exactly one
# commit deep. Because production and previews share the branch, each writer
# changes only its own subtree of the CURRENT branch (built from its trees, never
# a checkout) and pushes with a lease, retrying if another writer got in first.
name: site

on:
  pull_request:
    types: [opened, synchronize, reopened]
  # PR close/merge lands here, NOT on pull_request (whose types above exclude
  # closed): preview-cleanup must push to gh-pages, and a fork PR's
  # pull_request events carry a read-only GITHUB_TOKEN, so fork previews were
  # never cleaned up. pull_request_target keeps the write token for forks too.
  # It is safe HERE — and only because — the closed event runs nothing but
  # preview-cleanup, which never checks out or executes anything from the PR:
  # it deletes a directory from gh-pages using main's own scripts. Never route
  # an event that BUILDS through pull_request_target.
  pull_request_target:
    types: [closed]
  push:
    branches: [main]
  # preview-sweep only. The per-PR cleanup below fires once, on the closed
  # event; nothing retries it, so a preview that misses its one chance stays in
  # the live tree forever. #59, #85 and #89 did exactly that and sat there for
  # weeks (144 MB). This is the backstop that makes cleanup self-healing.
  # Weekly, Mondays 04:17 UTC. Odd minute on purpose: GitHub's scheduler is
  # best-effort and sheds load at :00. A missed tick just means next week.
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

concurrency:
  # Key PR runs on the PR NUMBER, not github.ref. Merging a PR fires two runs in
  # the same second — the push to main, and the closed event (which runs only
  # preview-cleanup) — and on a merged PR the refs/pull/<N>/merge ref is already
  # deleted, so the closed event's github.ref falls back to the BASE branch.
  # Under `site-${{ github.ref }}` that put the cleanup run in main's own group,
  # where cancel-in-progress is true for it (it is a PR event), so a
  # 49-second `git rm` of a preview directory evicted the production build ~2s
  # in: "Canceling since a higher priority waiting request for
  # site-refs/heads/main exists". Whichever of the two runs claimed the slot
  # first won, so it read as flaky — main lost 7 of 11 merges, leaving the live
  # site commits behind while every PR check showed green.
  #
  # A PR event can no longer name main's group, so the race cannot be entered.
  # The useful superseding survives: pushes to PR N still cancel N's stale
  # preview build, and closing N cancels a build for a preview about to be
  # deleted. Both are the same `site-<N>` group.
  group: site-${{ github.event.pull_request.number || github.ref }}
  # startsWith, not ==, so the pull_request_target closed event keeps the old
  # behaviour: closing PR N cancels N's now-pointless in-flight preview build.
  cancel-in-progress: ${{ startsWith(github.event_name, 'pull_request') }}

# Default read-only; the deploy/preview jobs opt into write explicitly.
permissions:
  contents: read

jobs:
  build:
    # On a PR *close* (pull_request_target) there is nothing to build — the
    # preview-cleanup job just removes the old preview. Nor on a sweep tick
    # (schedule/manual), which only prunes gh-pages. Every other event builds.
    if: >-
      github.event_name != 'pull_request_target'
      && github.event_name != 'schedule'
      && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    # A healthy warm run is ~2 minutes; a healthy COLD run ~7 (the TeX
    # download). The historically unbounded step was that download, which a
    # degraded Ubuntu mirror has stalled past 15 minutes while still *looking*
    # like progress — the TeX step now bounds its own apt commands with
    # wall-clock timeouts (see there), so this cap is a backstop, not the
    # thing that catches a mirror incident. It still has to clear a cold apt
    # that is slow-but-succeeding: the caps below allow up to 300s + 600s of
    # apt before ~4 minutes of node + site build. Cache entries expire after
    # 7 days unused, so cold runs recur and this is not a one-off bootstrap.
    timeout-minutes: 20
    steps:
      # lfs: true — figures under tex/**/fig/*.png are stored in Git LFS
      # (.gitattributes). Without this the working tree gets pointer files, and
      # any \includegraphics of one fails the PDF build with a libpng error.
      - uses: actions/checkout@v4
        with:
          lfs: true

      # Production is served at the ROOT of the custom domain
      # (iliad-intensive.org, set by public/CNAME), so it needs no path prefix;
      # a PR preview sits under /pr-preview/pr-<N>/ so its assets and links
      # resolve under the preview subpath. NOTE: package.json's `ci` script
      # must keep an EMPTY default for NEXT_PUBLIC_BASE_PATH — a `:-` default
      # fires on an empty value too and would silently re-add a prefix here.
      - name: Compute base path + commit
        id: cfg
        env:
          # The title is read through the environment, never spliced into the
          # script with ${{ }}. A PR title is text the PR's author controls, and
          # ${{ }} substitutes BEFORE bash sees the script, so a title
          # containing $(...) or a backtick would execute here. `env:` passes it
          # as data instead. (Not merely theoretical for a public repo: anyone
          # who can open a PR can choose this string.)
          PR_TITLE: ${{ github.event.pull_request.title }}
          # For `gh pr diff` below. Read access is all it needs.
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base=/pr-preview/pr-${{ github.event.number }}" >> "$GITHUB_OUTPUT"
            echo "pr=${{ github.event.number }}" >> "$GITHUB_OUTPUT"
            # A heredoc, not `title=$PR_TITLE`: a title may contain anything,
            # and a bare key=value line breaks on the first newline while an "="
            # in the title would be swallowed. The delimiter is prefixed so a
            # title cannot close it by containing the word EOF.
            {
              echo "title<<PR_TITLE_a91f4c"
              printf '%s\n' "$PR_TITLE"
              echo "PR_TITLE_a91f4c"
            } >> "$GITHUB_OUTPUT"
            # The PR's own head commit, not the synthetic merge commit.
            echo "sha=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
            # Partial previews (src/lib/preview.ts, scripts/prune-preview.mjs):
            # which worksheets this PR touches, from its diff against the merge
            # base. A path outside tex/<slug>/ that the site reads — shared
            # LaTeX, the converter, src/, schedule.yaml, the build itself —
            # makes it a FULL preview, as every preview was before. Paths the
            # site never reads (docs, skills, scratch; intensives/, whose page
            # is always built) mark nothing. If the file list cannot be fetched
            # the preview is full: one that quietly misses a changed page is
            # the failure this must never have.
            full=false
            nb_all=false
            declare -A seen=()
            if files=$(gh pr diff "${{ github.event.number }}" --name-only --repo "$GITHUB_REPOSITORY"); then
              while IFS= read -r f; do
                [ -n "$f" ] || continue
                # The generator and the header template change every notebook,
                # so every sheet then links the PR's (NOTEBOOK_PREVIEW_SLUGS).
                case "$f" in tex/gen_notebooks.py|tex/notebook-header.md) nb_all=true ;; esac
                case "$f" in
                  tex/*/*)
                    s=${f#tex/}; s=${s%%/*}
                    # A deleted or renamed-away worksheet has no page to show.
                    if [ -f "tex/$s/main.tex" ] || [ -f "tex/$s/main.mdx" ]; then seen[$s]=1; fi ;;
                  docs/*|.claude/*|scratch/*|intensives/*|*.md|LICENSE|.gitignore|.gitattributes) ;;
                  *) full=true ;;
                esac
              done <<< "$files"
            else
              echo "::warning::could not list this PR's files — building a full preview"
              full=true
              nb_all=true
            fi
            changed=$(IFS=,; echo "${!seen[*]}")
            echo "changed=$changed" >> "$GITHUB_OUTPUT"
            echo "full=$full" >> "$GITHUB_OUTPUT"
            # Which modules' notebooks the preview links on the PR's own
            # notebooks branch; every other sheet links production's, which for
            # a notebook the PR did not touch is the same notebook — and keeps
            # that sheet's cached build (scripts/worksheet-cache.mjs).
            if [ "$nb_all" = true ]; then nb="*"; else nb=$changed; fi
            echo "nb=$nb" >> "$GITHUB_OUTPUT"
            echo "preview scope: full=$full changed=${changed:-none} notebooks=${nb:-none}"
          else
            echo "base=" >> "$GITHUB_OUTPUT"
            echo "pr=" >> "$GITHUB_OUTPUT"
            echo "title=" >> "$GITHUB_OUTPUT"
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "changed=" >> "$GITHUB_OUTPUT"
            echo "full=" >> "$GITHUB_OUTPUT"
            echo "nb=" >> "$GITHUB_OUTPUT"
          fi

      # First, because build-plan.mjs below needs Node before anything is
      # installed; its npm cache restore is a couple of seconds.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            scripts/tex2mdx/package-lock.json

      # The .deb downloads for the TeX install (.github/install-tex.sh) — ~207 MB across ~130 packages —
      # plus a `manifest` file recording the package list they satisfy (written
      # only by a run that installed it successfully; it is what lets the next
      # run skip apt entirely). Lives in GitHub Actions cache, NOT in the
      # repository: nothing is committed, and `git clone` is unaffected. The
      # repo already caches npm, the worksheet builds and the tikz diagrams
      # the same way.
      #
      # The key hashes .github/apt-packages.txt, so editing the package list
      # re-keys the cache by itself — no version suffix to remember to bump.
      # restore-keys then seed the new key's first run with the previous
      # entry's .debs, so a list change downloads only the delta (apt treats
      # restored files as a download cache and fetches anything missing).
      # apt-tex-v1 is the fixed pre-manifest key this scheme replaced — worth
      # one seeding, harmless once evicted. Entries are evicted after 7 days
      # unused; PR-branch saves are invisible to sibling branches, so the
      # entry everyone shares is the one written on main.
      - name: Restore apt package cache
        uses: actions/cache@v4
        with:
          path: ~/apt-debs
          key: apt-tex-${{ runner.os }}-${{ hashFiles('.github/apt-packages.txt') }}
          restore-keys: |
            apt-tex-${{ runner.os }}-
            apt-tex-v1-${{ runner.os }}

      # Diagrams are content-addressed (tikz-<sha>.svg): restoring the cache
      # means unchanged diagrams are never recompiled.
      - name: Restore diagram cache
        uses: actions/cache@v4
        with:
          path: public/uploads
          key: tikz-${{ hashFiles('tex/**') }}
          restore-keys: tikz-

      # Worksheet artifacts, so a day nobody touched is not recompiled. Each
      # worksheet stores a hash of its inputs in tex/<slug>/.build-hash and the
      # build skips it when that hash matches AND its artifacts are all still
      # here (scripts/build-content.mjs) — restoring them is what makes the skip
      # possible. Deliberately NOT caching public/uploads: the diagram cache
      # above owns that path, and two cache actions on one path fight. The skip
      # check verifies every /uploads/ path its MDX references, so a diagram-cache
      # miss forces a rebuild rather than shipping a figure-less page.
      #
      # The key intentionally never hits (it carries the commit sha), so the
      # cache is rewritten every run and restore-keys pulls the newest one —
      # per-worksheet granularity lives in the hashes, not in the cache key.
      - name: Restore worksheet build cache
        uses: actions/cache@v4
        with:
          path: |
            tex/*/.build-hash
            tex/*/*.pdf
            tex/*/*.aux
            tex/*/*.bbl
            content/modules
            public/downloads
          key: worksheets-${{ github.sha }}
          restore-keys: worksheets-

      # Will anything compile? A worksheet whose inputs are unchanged since its
      # cached build compiles nothing, so a PR that touches only MDX sheets,
      # notebooks, the site or the docs needs no TeX Live at all — and the
      # install is the slowest step of a warm run (~70 s). Same check the build
      # makes (scripts/worksheet-cache.mjs), run before anything is installed;
      # it has to see the same notebook environment, which is part of the hash.
      - name: Plan (does this build need TeX?)
        id: plan
        env:
          NOTEBOOK_PREVIEW_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.number || '' }}
          NOTEBOOK_PREVIEW_SLUGS: ${{ steps.cfg.outputs.nb }}
        run: node scripts/build-plan.mjs

      # .github/install-tex.sh — the package set, the warm .deb path, the
      # mirror-proof cold path and the pdflatex-only formats are all explained
      # there. Started in the background so it overlaps Typst, `npm ci` and the
      # rest; "Build" waits for it. (A step's background processes live until
      # the job ends.)
      - name: TeX Live + poppler (in the background)
        if: steps.plan.outputs.tex == 'true'
        run: |
          nohup bash -c '.github/install-tex.sh; echo $? > "$RUNNER_TEMP/tex.status"' \
            > "$RUNNER_TEMP/tex.log" 2>&1 &

      # Typst, for decks written as tex/<slug>/slides*.typ. One pinned static
      # binary, checksum-verified by scripts/install-typst.sh (the same script
      # ./setup.sh runs). Cached on that script's hash: bumping the version
      # there re-keys the cache by itself. Not apt — Ubuntu 24.04 has no
      # typst package.
      - name: Restore Typst
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/typst
          key: typst-${{ runner.os }}-${{ hashFiles('scripts/install-typst.sh') }}
      - name: Typst
        run: |
          scripts/install-typst.sh "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install deps
        run: |
          npm ci
          npm ci --prefix scripts/tex2mdx

      # Production's downloads and figures, with their git blob ids, so a
      # preview can link any file identical to production's rather than publish
      # it again (scripts/prune-preview.mjs). Trees only — no file contents are
      # fetched — so it costs a second or two. Best-effort: without the list the
      # preview simply carries every file, as it always did.
      - name: List production's files (previews link identical ones)
        if: github.event_name == 'pull_request'
        run: |
          if git fetch -q --depth=1 --filter=blob:none origin +gh-pages:refs/remotes/origin/gh-pages \
             && git ls-tree -r refs/remotes/origin/gh-pages -- downloads uploads > "$RUNNER_TEMP/prod-assets.txt"; then
            echo "PREVIEW_PROD_ASSETS=$RUNNER_TEMP/prod-assets.txt" >> "$GITHUB_ENV"
            echo "production has $(wc -l < "$RUNNER_TEMP/prod-assets.txt") downloads/figures"
          else
            echo "::warning::could not list production's files — this preview publishes every download and figure"
          fi

      # The SAME command developers and the pre-push hook run locally
      # (./run.sh ci) — one definition in package.json, no drift. The base path
      # is the only thing that varies between production and a preview.
      - name: Build (identical to ./run.sh ci)
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.cfg.outputs.base }}
          # Non-empty only on PR builds → renders the "not the live site" banner.
          NEXT_PUBLIC_PREVIEW_PR: ${{ steps.cfg.outputs.pr }}
          # The PR's title, so a preview tab says WHICH change it is showing
          # rather than only a number. Safe as an env value; React escapes it
          # when rendering.
          NEXT_PUBLIC_PREVIEW_PR_TITLE: ${{ steps.cfg.outputs.title }}
          # Shown in the footer, linked to the commit on GitHub.
          NEXT_PUBLIC_COMMIT_SHA: ${{ steps.cfg.outputs.sha }}
          # Partial previews: the worksheets this PR touched, and whether a
          # shared input changed (then everything is built). Both empty on a
          # push to main, and ignored by any build with no preview PR set
          # (src/lib/preview.ts) — production can never come out partial.
          PREVIEW_CHANGED_SLUGS: ${{ steps.cfg.outputs.changed }}
          PREVIEW_FULL: ${{ steps.cfg.outputs.full }}
          # A same-repo PR's preview links the PR's own Colab notebooks, which
          # notebooks.yml publishes to the `notebooks-pr-<N>` branch — for the
          # modules in NOTEBOOK_PREVIEW_SLUGS; the rest link production's
          # (scripts/worksheet-cache.mjs). A fork's PR cannot publish them, so
          # its preview links production's. Empty on main.
          NOTEBOOK_PREVIEW_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.number || '' }}
          NOTEBOOK_PREVIEW_SLUGS: ${{ steps.cfg.outputs.nb }}
          # "false" when the plan skipped TeX Live: a sheet that turns out to
          # need it then fails with the reason (scripts/build-content.mjs).
          TEX_INSTALLED: ${{ steps.plan.outputs.tex }}
          # The overflow check runs as its own job (`overflow` below), beside
          # the deploy instead of ahead of it — it is advisory, and took ~28 s.
          SKIP_OVERFLOW_CHECK: '1'
        run: |
          if [ "$TEX_INSTALLED" = true ]; then
            # 900 s clears the install's own apt caps (300 s + 600 s would not
            # both run in full; a healthy cold install is ~330 s).
            waited=0
            until [ -f "$RUNNER_TEMP/tex.status" ] || [ $waited -ge 900 ]; do sleep 1; waited=$((waited + 1)); done
            echo "::group::TeX Live + poppler (waited ${waited}s for the background install)"
            cat "$RUNNER_TEMP/tex.log"
            echo "::endgroup::"
            [ "$(cat "$RUNNER_TEMP/tex.status" 2>/dev/null)" = 0 ] \
              || { echo "::error::TeX Live install failed or timed out — log in the group above"; exit 1; }
          fi
          npm run ci

      # A GitHub Pages branch source runs Jekyll by default, which drops
      # directories that start with "_" (killing Next's _next/ assets) — so mark
      # the output to skip Jekyll. Also refuse to proceed if the build produced
      # no index.html, so an empty/broken build can never be published (and, with
      # clean:true, wipe the live site).
      - name: Disable Jekyll + guard against an empty build
        run: |
          test -f out/index.html || { echo "::error::build produced no out/index.html — refusing to publish"; exit 1; }
          touch out/.nojekyll

      # Hand the built site to the deploy/preview jobs so it is built exactly
      # once per run (with the base path this event needs).
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: out
          include-hidden-files: true   # keep .nojekyll in the artifact
          retention-days: 1
      # check-overflow.mjs's list of pages; not part of the site itself.
      - uses: actions/upload-artifact@v4
        with:
          name: content-index
          path: content/index.json
          retention-days: 1

  # Advisory, like it always was: headless Chrome over every built page, looking
  # for content past the column edge (scripts/check-overflow.mjs). It used to be
  # the last ~28 s of `npm run ci`, so every deploy waited on a check that can
  # never block one; as its own job it runs beside the deploy instead. Never
  # fails: an overflow is a warning in this job's log, as before.
  overflow:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      # For schedule.mjs's YAML parser. Chrome is on the runner image already.
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: out
      - uses: actions/download-artifact@v4
        with:
          name: content-index
          path: content
      - name: Check for overflow past the column edge
        run: node scripts/check-overflow.mjs || echo '(overflow check unavailable — advisory only)'

  # Production: publish the built site to the ROOT of gh-pages. clean-exclude
  # keeps every active PR preview in place (they live under pr-preview/).
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # No `concurrency:` lock. Writers used to share one (gh-pages-write), but
    # GitHub keeps only one PENDING job per group and cancels the older one, so
    # a burst of three writers silently lost the middle one. The publish script
    # changes only its own part of the current branch and pushes with a lease,
    # retrying if another writer got in first (.github/publish-gh-pages.sh).
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: out
      # The force-push below replaces gh-pages outright; never let it run
      # against an empty/failed artifact download (e.g. during a GitHub
      # incident), which would publish an empty site.
      - name: Guard against an empty artifact
        run: test -f out/index.html || { echo "::error::empty artifact — refusing to deploy (would wipe the live site)"; exit 1; }
      # The built site becomes the root of gh-pages; every live preview under
      # pr-preview/ is carried over from the current branch by the script.
      - name: Publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          .github/publish-gh-pages.sh production out "Deploy ${{ github.sha }}"

  # Preview: publish the built site to gh-pages/pr-preview/pr-<N>/ and comment
  # the URL on the PR. Only runs after `build` succeeds — i.e. the PR passed the
  # check ladder. SAME-REPO PRs only: a pull_request event from a fork carries a
  # read-only GITHUB_TOKEN (this run executes the fork's code, so GitHub caps
  # it), and the push would 403 — that was PR #119. Fork PRs are previewed by
  # .github/workflows/fork-preview.yml instead, which runs after this workflow
  # completes, with a write token but without ever executing PR code.
  preview-deploy:
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    # No `concurrency:` lock. Writers used to share one (gh-pages-write), but
    # GitHub keeps only one PENDING job per group and cancels the older one, so
    # a burst of three writers silently lost the middle one. The publish script
    # changes only its own part of the current branch and pushes with a lease,
    # retrying if another writer got in first (.github/publish-gh-pages.sh).
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: out
      # Replaces THIS PR's pr-preview/pr-<N>/ and nothing else — production and
      # the other previews are carried over from the current branch, so the
      # blast radius stays this PR. Block scalar, not a plain one: in an unquoted
      # YAML scalar " #" opens a comment and would truncate the message.
      - name: Publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          .github/publish-gh-pages.sh preview "${{ github.event.number }}" out "Preview for PR #${{ github.event.number }}"
      # Best-effort comment with the URL. continue-on-error so a GitHub API
      # blip can't fail an otherwise-successful deploy (the URL is deterministic
      # anyway). Upserts a single marked comment rather than spamming.
      - name: Comment preview URL
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.issue.number;
            const url = `https://iliad-intensive.org/pr-preview/pr-${pr}/`;
            const marker = '<!-- pr-preview-url -->';
            // The PR's head commit — NOT context.sha, which on pull_request is
            // the ephemeral refs/pull/N/merge commit and never matches the PR.
            const headSha = context.payload.pull_request.head.sha;
            // What the preview holds: scripts/prune-preview.mjs writes the
            // manifest into the built site, which this job has downloaded.
            let scope = '';
            try {
              const m = JSON.parse(require('fs').readFileSync('out/preview-manifest.json', 'utf8'));
              const page = (c) => `[${c.code ? `${c.code} ` : ''}${c.title}](${url}${c.path.replace(/^\//, '')})`;
              scope = m.full
                ? '\n\nFull site: this PR touches shared files, so every page was rebuilt.'
                : m.changed.length
                  ? `\n\nChanged pages (green on the preview\'s homepage): ${m.changed.map(page).join(' · ')}. Every other worksheet link opens the live site.`
                  : '\n\nNo worksheet pages changed: the preview holds the homepage, status and intensives pages, and every worksheet link opens the live site.';
            } catch { /* no manifest (an older build): say nothing extra */ }
            const body = `${marker}\n🔎 **Live preview:** ${url}\n\nUpdated for \`${headSha.slice(0, 7)}\`. Removed automatically when this PR closes.${scope}`;
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: pr });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: pr, body });
            }

  # When a PR closes, delete its preview subtree from gh-pages. No build needed.
  # Runs on pull_request_target (see `on:`) so it holds a write token for fork
  # PRs too — safe only while this job touches nothing from the PR itself.
  preview-cleanup:
    if: github.event_name == 'pull_request_target' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    # No `concurrency:` lock. Writers used to share one (gh-pages-write), but
    # GitHub keeps only one PENDING job per group and cancels the older one, so
    # a burst of three writers silently lost the middle one. The publish script
    # changes only its own part of the current branch and pushes with a lease,
    # retrying if another writer got in first (.github/publish-gh-pages.sh).
    steps:
      # Pin to main for the publish script. The default checkout would resolve
      # refs/pull/<N>/merge, which is already deleted by the time a MERGED PR
      # fires its closed event (see the concurrency note at the top).
      - uses: actions/checkout@v4
        with:
          ref: main
      # A PR with no preview leaves the branch as it is ("nothing to publish").
      - name: Remove PR preview
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          .github/publish-gh-pages.sh remove "Remove preview for PR #${{ github.event.number }}" "${{ github.event.number }}"
      - name: Update comment (preview removed)
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.issue.number;
            const marker = '<!-- pr-preview-url -->';
            const body = `${marker}\n🧹 Preview removed (this PR is closed).`;
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: pr });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });

  # Backstop for preview-cleanup. That job gets exactly one chance — the PR's
  # `closed` event — and if it is cancelled, fails, or never fires, the preview
  # is orphaned in gh-pages with nothing to notice. This reconciles the live
  # tree against reality daily: every pr-preview/pr-<N>/ whose PR is not OPEN
  # goes. Deleting an in-flight preview is not a risk — the PR's next push
  # republishes it.
  preview-sweep:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    # No `concurrency:` lock. Writers used to share one (gh-pages-write), but
    # GitHub keeps only one PENDING job per group and cancels the older one, so
    # a burst of three writers silently lost the middle one. The publish script
    # changes only its own part of the current branch and pushes with a lease,
    # retrying if another writer got in first (.github/publish-gh-pages.sh).
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove previews whose PR is no longer open
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          removed=()
          unknown=0
          # Assigned first, so a failed listing fails the job (a failure inside
          # `for n in $(…)` would just sweep nothing).
          previews=$(.github/publish-gh-pages.sh list)
          for n in $previews; do
            # Delete ONLY on a definitive CLOSED/MERGED. `gh pr view` fails the
            # same way for "no such PR" as for a rate limit, a network blip or a
            # bad token, so treating every failure as sweepable would delete a
            # live preview whenever the API hiccups. Anything we cannot confirm
            # is kept; the next tick retries.
            state=$(gh pr view "$n" --repo "$GITHUB_REPOSITORY" --json state -q .state 2>/dev/null) || state=UNKNOWN
            case "$state" in
              CLOSED|MERGED)
                echo "sweep  pr-$n ($state)"
                removed+=("$n")
                ;;
              OPEN)
                echo "keep   pr-$n (OPEN)"
                ;;
              *)
                echo "::warning::pr-$n: could not determine PR state (got '${state:-empty}') — keeping the preview"
                unknown=$((unknown + 1))
                ;;
            esac
          done
          if [ "$unknown" -gt 0 ]; then
            echo "::warning::$unknown preview(s) skipped — PR state unresolved this run"
          fi
          if [ ${#removed[@]} -eq 0 ]; then
            echo "nothing to sweep"
            exit 0
          fi
          .github/publish-gh-pages.sh remove "Sweep previews for closed PRs: ${removed[*]/#/#}" "${removed[@]}"
