# tex -> mdx -> static site. Only tex/ sources live in git; MDX, SVGs, PDFs
# and the site itself are build artifacts. PRs get the full check ladder
# (conversion + render gate + PDF builds); pushes to main also deploy to
# GitHub Pages.
name: site

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # lfs: true — figures under tex/**/fig/*.png are stored in Git LFS
      # (.gitattributes). Without this the working tree gets pointer files, and
      # any \includegraphics of one fails the PDF build with a libpng error.
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: TeX Live + poppler + pandoc
        # Keep this list in sync with ./setup.sh — it is the reference package
        # set. cm-super: scalable CM fonts, needed by microtype's font
        # expansion under [T1]{fontenc}. lmodern: pandoc's default PDF template
        # (used for MDX-authored worksheets) loads lmodern.sty unconditionally;
        # it is only a Recommends of texlive, so --no-install-recommends drops
        # it — name it explicitly.
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-extra texlive-pictures texlive-science \
            texlive-fonts-recommended cm-super lmodern poppler-utils pandoc
          # contributor LaTeX is untrusted: never enable shell-escape

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            scripts/tex2mdx/package-lock.json

      - name: Install deps
        run: |
          npm ci
          npm ci --prefix scripts/tex2mdx

      # Diagrams are content-addressed (tikz-<sha>.svg): restoring the cache
      # means unchanged diagrams are never recompiled.
      - name: Restore diagram cache
        uses: actions/cache@v4
        with:
          path: public/uploads
          key: tikz-${{ hashFiles('tex/**') }}
          restore-keys: tikz-

      # The SAME command developers and the pre-push hook run locally
      # (./run.sh ci) — one definition in package.json, no drift.
      - name: Build (identical to ./run.sh ci)
        run: npm run ci

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
