# days.yml — the roster of teaching days: the ONE hand-kept input to the
# status table at /admin/status.
#
# Why this file is small: everything the build can observe, the build observes.
# Whether a day's worksheet is live, whether its deck compiled, where its PDF
# sits — all read off disk at build time, so those columns cannot go stale. The
# one thing the build cannot know is the day list itself: a day with no
# worksheet yet has nothing on disk to find. That list is this file.
#
# ── How a day finds its worksheet ───────────────────────────────────────────
# You do NOT list slugs here. A worksheet claims its day from its own source,
# with one line in the `%--- iliad ---` block of tex/<slug>/main.tex:
#
#     %--- iliad ---
#     % day: B.4
#     %--- end ---
#
# (or `day: B.4` in the YAML frontmatter of an MDX-authored main.mdx). So
# porting a day means editing one file — your own — and the row fills itself
# in: material link, PDF, deck. Several worksheets may claim the same day
# (D.3 is AIXI + Solomonoff Induction); they all show up in that row. A
# worksheet claiming a `day:` that isn't listed here fails the build, so a
# typo can't silently orphan a page.
#
# ── Fields ──────────────────────────────────────────────────────────────────
#   code       required  Day code, e.g. B.4. The letter is the cluster id and
#                        must exist in clusters.json. Codes must be unique.
#   title      required  The day's name, as the schedule calls it.
#   lead       required  Who owns the material — the person to ask.
#   doc        required  This day's tab in the big Google Doc (docs/LINKS.md).
#   source     required  Where the *buildable* source is, for a day nobody has
#                        ported yet. Ignored the moment a worksheet claims the
#                        day — the table then shows "in repo" instead, so this
#                        field can never rot into a lie. One of:
#                          ready     real source in hand, just needs porting in
#                          readings  reading day — the reading list IS the
#                                    material; no worksheet by design
#                          partial   something missing, or source unverified
#                          missing   only compiled PDFs exist; nothing buildable
#   sourceUrl  optional  Upstream repo, for `ready` / `partial`.
#   slides     optional  URL of a deck hosted elsewhere — the prebuilt PDF
#                        somebody handed you, with no LaTeX source. Used only
#                        while no worksheet supplies a deck. Full precedence:
#                          a compiled tex/<slug>/slides.tex  (hosted here)
#                            → a worksheet's own `slides:` frontmatter URL
#                            → this key
#                            → no deck
#   note       optional  One short, durable, neutral line. /admin/status is
#                        PUBLIC: no chase-ups, no blame, nothing you wouldn't
#                        say to the lead's face. That belongs in
#                        scratch/MATERIAL.md, which is gitignored and never
#                        reaches the site.
#
# Live days only. The wrap-up day carries no module material and is left out.

