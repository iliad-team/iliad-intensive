        worksheets:
          - ai-alignment-intro

      - code: A.2
        title: Alignment in Practice
        lead: Evzen
        doc: https://docs.google.com/document/d/1ZI_JIg_-CeMZpZKxlh8TdmVmn6CK3UIbIz_Wl-g9U8o/edit?tab=t.i1ocmcfi54i2
        source: missing
        note: deck exists as a Drive PDF only — add its URL as `slides:` when you have it
        worksheets:
