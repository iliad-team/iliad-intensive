# schedule.yaml — the curriculum, in order. The single hand-kept file the
# build reads; everything else about a worksheet is observed, not declared.
#
# This file owns three things, and nothing else does:
#
#   1. the clusters — their order, display labels, and URL segments
#   2. the teaching days within each cluster, in the order they are taught
#   3. which worksheets are the material for each day, in reading order
#
# Order is positional throughout: the order of `clusters:`, of a cluster's
# `days:`, and of a day's `worksheets:` IS the order the site presents them —
# on the homepage, in the sidebar, and on /admin/status. There are no sort
# keys to keep in sync, and no alphabetical fallback to be surprised by
# (Solomonoff Induction before AIXI is a fact about teaching order, which no
# sort of the titles could have recovered).
#
# ── Where a worksheet's day and cluster come from ───────────────────────────
# Here, and only here. A tex/<slug>/main.tex carries its own title, summary and
# contributors — things about the worksheet — but never its place in the course.
# The build stamps `cluster:` and `day:` into the generated MDX from this file,
# so a day's material is one edit here, and no source file can disagree with
# the schedule about where it sits. Writing `cluster:` or `day:` in a worksheet
# frontmatter block is an error.
#
# Every worksheet in tex/ must be listed by exactly one day, or be marked
# `unlisted: true` in its own frontmatter (the format-demo sheet). Anything
# else fails the build rather than sorting itself silently to the bottom.
#
# ── Cluster fields ─────────────────────────────────────────────────────────
#   id         required  Single letter/digit. The part of a day code before the
#                        dot: day B.4 belongs to cluster B. Unique.
#   label      required  Heading shown above the cluster's worksheets.
#   urlSlug    required  First path segment: /learning/training-dynamics/.
#                        Unique, and never "admin" (it would shadow
#                        /admin/status and make the worksheet unreachable).
#   days       optional  The teaching days, in taught order.
#
# ── Day fields ─────────────────────────────────────────────────────────────
#   code       required  e.g. B.4. Its letter must be the enclosing cluster's
#                        id. Unique across the file.
#   title      required  The day's name, as the schedule calls it.
#   lead       required  Who owns the material — the person to ask.
#   doc        required  This day's tab in the big Google Doc (docs/LINKS.md).
#   worksheets optional  Slugs of tex/<slug>/ worksheets, in reading order.
#                        Omit or leave empty for a day nobody has ported yet.
#                        Several worksheets per day is normal (D.3 is
#                        Solomonoff Induction then AIXI) — the site numbers them
#                        from this order and lists them under the day: D.3.1,
#                        D.3.2. A day with one worksheet is never numbered, so a
#                        dotted code always means "part n of several". Display
#                        only: `code` above stays the day's single identity, and
#                        it is what /admin/status, the issues and the project
#                        board speak.
#   source     required  Where the *buildable* source is for a day nobody has
#                        ported yet. Ignored the moment the day has a
#                        worksheet — /admin/status then shows "in repo"
#                        instead, so this field can never rot into a lie. Every
#                        day needs a worksheet and a deck, reading days no less
#                        than the rest, so there is no "readings" exemption. One
#                        of:
#                          ready     real source in hand, just needs porting in
#                          partial   something missing, or source unverified
#                          missing   only compiled PDFs exist; nothing buildable
#   sourceUrl  optional  Upstream repo, for `ready` / `partial`.
#   slides     optional  URL of a deck hosted elsewhere — the prebuilt PDF
#                        somebody handed you, with no LaTeX source. Used only
#                        while no worksheet supplies a deck. Full precedence:
#                          a compiled tex/<slug>/slides.tex  (hosted here)
#                            → a worksheet's own `slides:` frontmatter URL
#                            → this key
#                            → no deck
#   note       optional  One short, durable, neutral line. /admin/status is
#                        PUBLIC: no chase-ups, no blame, nothing you wouldn't
#                        say to the lead's face. That belongs in
#                        scratch/MATERIAL.md, which is gitignored and never
#                        reaches the site.
#
# Live days only. The wrap-up day carries no module material and is left out.

clusters:
