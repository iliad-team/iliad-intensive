# The Berkeley run, August 2026. The filename is the URL segment, so this file
# is served at /intensives/aug2026-berkeley/.
#
# Each day is a date plus ONE of:
#   code:   a teaching day in schedule.yaml — its worksheets become the links
#   title:  anything else (a day not in schedule.yaml, an off day, launch day)
# and an optional `teacher:`. Dates must increase down the list. That is the
# whole format.
#
# `teacher` lives here rather than in schedule.yaml because it is a fact about
# this run: schedule.yaml's `lead:` is who owns the material, and the two
# differ on six of the days below.

title: Iliad Intensive
location: Berkeley

# The same every teaching day, so it is stated once instead of per day.
rhythm:
  - time: "10:00 – 12:30"
    what: Morning session
  - time: "12:30 – 13:30"
    what: Lunch
  - time: "13:30 – 17:40"
    what: Afternoon session
  - time: "17:40 – 18:00"
    what: Daily feedback form
  - time: "18:00 – 19:00"
    what: Dinner

days:
